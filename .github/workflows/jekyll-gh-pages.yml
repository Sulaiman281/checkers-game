name: 🚀 Build & Deploy React + Jekyll Site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Ruby (for Jekyll)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2
          bundler-cache: true

      - name: ⚙️ Setup Node.js (for React)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: |
          echo "Installing Ruby & Node dependencies..."
          bundle install
          if [ -f package.json ]; then
            npm ci
          fi

      - name: 🏗️ Build React App
        run: |
          echo "Building React app..."
          if [ -f package.json ]; then
            npm run build
            mkdir -p ./_site/react
            cp -r build/* ./_site/react/
          fi

      - name: 🧱 Build Jekyll Site
        run: |
          echo "Building Jekyll site..."
          bundle exec jekyll build -d _site

      - name: 🔗 Merge React into Jekyll Output
        run: |
          echo "Merging React build into final _site..."
          if [ -d "./_site/react" ]; then
            cp -r ./_site/react/* ./_site/
          fi

      - name: 📤 Upload Artifact for Deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
